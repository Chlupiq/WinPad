name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syscall-stubs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          python3 -m pip install -q -r tools/pe-reloc-audit/requirements.txt
      - name: Syscall stubs have no code relocations
        run: sh tests/syscall-stubs/run.sh

  fxcc-inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -I tools/fxcc-inspect/test_fxcc_inspect.py
          python3 -I tools/cache2macho/test_cache2macho.py

  fex-cache:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld cmake ninja-build python3 gdb
      - name: Restore FEX build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fex-build
          key: fex-build-${{ runner.arch }}-${{ hashFiles('tests/fex-cache/fex-commit', 'tests/fex-cache/build-fex.sh', 'tests/fex-cache/fetch-fex.sh', 'patches/fex/*.patch', 'tests/probe/*') }}
      - name: Build FEX and generate a code cache
        env:
          WORK_DIR: ${{ runner.temp }}/fex-work
          FEX_BUILD: ${{ runner.temp }}/fex-build
        run: sh tests/fex-cache/run.sh
      - name: Probe frontend runs the guest from an AOT image
        timeout-minutes: 20
        env:
          WORK_DIR: ${{ runner.temp }}/fex-work
          FEX_BUILD: ${{ runner.temp }}/fex-build
        run: sh tests/probe/run.sh
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-cache-census
          path: |
            ${{ runner.temp }}/fex-work/census.json
            ${{ runner.temp }}/fex-work/fexserver.log
            ${{ runner.temp }}/fex-work/fex-*-run.log
            ${{ runner.temp }}/fex-work/aot-census.json
            ${{ runner.temp }}/fex-work/aot*.o
            ${{ runner.temp }}/fex-work/dispatcher1.bin
            ${{ runner.temp }}/fex-work/aot.so
            ${{ runner.temp }}/fex-work/home/.cache/fex-emu
            ${{ runner.temp }}/fex-work/probe
          if-no-files-found: warn

  probe-macos:
    needs: fex-cache
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Code map and guest from the Linux probe run
        uses: actions/download-artifact@v4
        with:
          name: fex-cache-census
          path: ${{ runner.temp }}/linux
      - name: Probe frontend runs the guest from a Mach-O AOT image
        timeout-minutes: 60
        run: sh tests/probe/run-macos.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-macos" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/linux/probe"
      - name: Upload probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-macos
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
      - name: iPad test app as an unsigned IPA
        run: sh tests/ios/build-app.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios-app" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/probe"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinPadProbe-ipa
          path: ${{ runner.temp }}/ipa/WinPadProbe.ipa
          if-no-files-found: error
      - name: iPad test app as an Xcode project, run on an iPad simulator
        timeout-minutes: 60
        run: |
          brew install xcodegen
          sh tests/ios/build-xcode.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios-app" "$RUNNER_TEMP/ipa" \
              "$RUNNER_TEMP/fex-ios-sim" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/xcode"
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: WinPadProbe-xcode
          path: ${{ runner.temp }}/xcode/WinPadProbe-xcode
          if-no-files-found: error

  fexcore-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Build FEXCore for iOS
        run: sh tests/ios/build-fexcore.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios"
