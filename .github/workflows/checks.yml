name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syscall-stubs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          python3 -m pip install -q -r tools/pe-reloc-audit/requirements.txt
      - name: Syscall stubs have no code relocations
        run: sh tests/syscall-stubs/run.sh

  wow-window:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Madeira's guest-window placement, with patches/madeira, on the address map of an iPad
        run: sh tests/wine-loader/check-wow-window.sh "$RUNNER_TEMP/wow-window"

  fxcc-inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -I tools/fxcc-inspect/test_fxcc_inspect.py
          python3 -I tools/cache2macho/test_cache2macho.py

  fex-cache:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld cmake ninja-build python3 gdb
      - name: Restore FEX build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fex-build
          key: fex-build-${{ runner.arch }}-${{ hashFiles('tests/fex-cache/fex-commit', 'tests/fex-cache/build-fex.sh', 'tests/fex-cache/fetch-fex.sh', 'patches/fex/*.patch', 'tests/probe/*') }}
      - name: Build FEX and generate a code cache
        env:
          WORK_DIR: ${{ runner.temp }}/fex-work
          FEX_BUILD: ${{ runner.temp }}/fex-build
        run: sh tests/fex-cache/run.sh
      - name: Probe frontend runs the guest from an AOT image
        timeout-minutes: 20
        env:
          WORK_DIR: ${{ runner.temp }}/fex-work
          FEX_BUILD: ${{ runner.temp }}/fex-build
        run: sh tests/probe/run.sh
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-cache-census
          path: |
            ${{ runner.temp }}/fex-work/census.json
            ${{ runner.temp }}/fex-work/fexserver.log
            ${{ runner.temp }}/fex-work/fex-*-run.log
            ${{ runner.temp }}/fex-work/aot-census.json
            ${{ runner.temp }}/fex-work/aot*.o
            ${{ runner.temp }}/fex-work/dispatcher1.bin
            ${{ runner.temp }}/fex-work/aot.so
            ${{ runner.temp }}/fex-work/home/.cache/fex-emu
            ${{ runner.temp }}/fex-work/probe
          if-no-files-found: warn

  fex-wow64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build python3
      - name: Restore the FEX WoW64 build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fex-wow64
          key: fex-wow64-${{ hashFiles('tests/fex-wow64/build.sh', 'patches/fex-wow64/*') }}
          restore-keys: fex-wow64-
      - name: FEX's WoW64 module (xtajit.dll) and offline compiler build from Madeira's FEX fork
        run: sh tests/fex-wow64/build.sh "$RUNNER_TEMP/fex-wow64"
      - name: Upload xtajit.dll
        uses: actions/upload-artifact@v4
        with:
          name: xtajit
          path: |
            ${{ runner.temp }}/fex-wow64/xtajit.dll
            ${{ runner.temp }}/fex-wow64/FEXOfflineCompiler.exe

  probe-macos:
    needs: fex-cache
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install ninja lld
          echo "$(brew --prefix lld)/bin" >>"$GITHUB_PATH"
      - name: Code map and guest from the Linux probe run
        uses: actions/download-artifact@v4
        with:
          name: fex-cache-census
          path: ${{ runner.temp }}/linux
      - name: Probe frontend runs the guest from a Mach-O AOT image
        timeout-minutes: 60
        run: sh tests/probe/run-macos.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-macos" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/linux/probe"
      - name: Upload probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-macos
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
      - name: iPad test app as an unsigned IPA
        run: sh tests/ios/build-app.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios-app" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/probe"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinPadProbe-ipa
          path: ${{ runner.temp }}/ipa/WinPadProbe.ipa
          if-no-files-found: error
      - name: iPad test app as an Xcode project, run on an iPad simulator
        timeout-minutes: 60
        run: |
          brew install xcodegen
          sh tests/ios/build-xcode.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios-app" "$RUNNER_TEMP/ipa" \
              "$RUNNER_TEMP/fex-ios-sim" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/xcode"
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: WinPadProbe-xcode
          path: ${{ runner.temp }}/xcode/WinPadProbe-xcode
          if-no-files-found: error

  pe2macho:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install lld
      - name: A Windows DLL wrapped into a dylib runs on the Mac
        run: |
          PATH="$(brew --prefix lld)/bin:$PATH"
          sh tests/pe2macho/run-macos.sh "$RUNNER_TEMP/pe2macho"
      - name: Every Wine module from Madeira wrapped into a dylib and loaded
        run: sh tests/pe2macho/wine-modules.sh "$RUNNER_TEMP/wine-modules"

  wine-loader:
    runs-on: macos-15
    needs: fex-wow64
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bison flex llvm lld xcodegen
      - name: Newest Xcode (Madeira's server_ios.c needs the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode_*.app
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcrun --sdk iphoneos --show-sdk-version
      - name: Boot an iPad simulator now, while Wine builds
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -I tests/ios/xcode/pick-ipad.py 17.0)
          xcrun simctl boot "$udid" || true
      - name: Restore configured Wine tree
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wine-loader/madeira/wine
          key: wine-configured-257f271-${{ hashFiles('tests/wine-loader/build.sh') }}
      - name: Madeira's iOS ntdll loader builds, also with the adopt patch
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-loader/build.sh "$RUNNER_TEMP/wine-loader"
      # The Wine libraries only change with their build scripts and patches;
      # a hit skips the builds below.
      - name: Restore the i386 Wine build tree
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wine-loader/madeira/wine/build-i386
          key: wine-i386-257f271-${{ hashFiles('tests/wine-i386/build.sh', 'tests/wine-i386/build-d3d9.sh', 'patches/wine/0003-*') }}
      - name: Restore built Wine libraries
        id: wine-built
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/wine-loader/ntdll-iphoneos
            ${{ runner.temp }}/wine-loader/ntdll-iphonesimulator
            ${{ runner.temp }}/wine-loader/wineserver-iphoneos
            ${{ runner.temp }}/wine-loader/wineserver-iphonesimulator
            ${{ runner.temp }}/wine-loader/win32u-iphoneos
            ${{ runner.temp }}/wine-loader/win32u-iphonesimulator
            ${{ runner.temp }}/wine-loader/modules-iphonesimulator
          key: wine-built-v1-${{ hashFiles('tests/wine-loader/build*.sh', 'tests/wine-loader/wrap-modules.sh', 'patches/madeira/*', 'patches/wine/*', 'tools/pe2macho/*') }}
      - name: Whole ntdll unix side for iOS, with the adopt patch
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: sh tests/wine-loader/build-ntdll.sh "$RUNNER_TEMP/wine-loader" iphoneos
      - name: The same for the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: sh tests/wine-loader/build-ntdll.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: wineserver for iOS and the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: |
          PATH="$(brew --prefix llvm)/bin:$PATH"
          sh tests/wine-loader/build-wineserver.sh "$RUNNER_TEMP/wine-loader" iphoneos
          sh tests/wine-loader/build-wineserver.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: win32u unix side (windows, GDI, fonts, display driver) for iOS and the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-loader/build-win32u.sh "$RUNNER_TEMP/wine-loader" iphoneos
          sh tests/wine-loader/build-win32u.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: Madeira's Wine modules wrapped into dylibs for the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: Wine's 32-bit x86 modules (ntdll up to the DLLs a game imports) and the 32-bit test programs
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-i386/build.sh "$RUNNER_TEMP/wine-loader"
      - name: Minimal Wine host linked from both and run on an iPad simulator
        timeout-minutes: 20
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader"
      - name: Wine's clock.exe draws its window with GDI on an iPad simulator
        timeout-minutes: 20
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" 'C:\windows\system32\clock.exe'
      - name: Window content of the clock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-clock
          path: ${{ runner.temp }}/wine-loader/host-clock/frames
          if-no-files-found: ignore
      - name: Wine's notepad.exe takes typed keys and a tap on its menu on an iPad simulator
        env:
          WINEHOST_TYPE: Hello iPad
          WINEHOST_CLICK_MENU: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" 'C:\windows\system32\notepad.exe'
      - name: Window content of notepad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-notepad
          path: ${{ runner.temp }}/wine-loader/host-notepad/frames
          if-no-files-found: ignore
      - name: Wine's Minesweeper (winemine.exe) opens a field when tapped on an iPad simulator
        env:
          WINEHOST_CLICK: 50,70
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" 'C:\windows\system32\winemine.exe'
      - name: Window content of Minesweeper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-winemine
          path: ${{ runner.temp }}/wine-loader/host-winemine/frames
          if-no-files-found: ignore
      - name: FEX's WoW64 module built from source (fex-wow64 job)
        uses: actions/download-artifact@v4
        with:
          name: xtajit
          path: ${{ runner.temp }}/xtajit
      - name: Use it in place of Madeira's prebuilt xtajit.dll
        run: cp "$RUNNER_TEMP/xtajit/xtajit.dll" "$RUNNER_TEMP/wine-loader/modules-iphonesimulator/aarch64-windows/xtajit.dll"
      - name: That xtajit.dll is wrapped into a dylib like the other modules, so Wine runs it from there and not from the JIT pool
        run: |
          sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphonesimulator \
            "$RUNNER_TEMP/wine-loader/modules-iphonesimulator/aarch64-windows/xtajit.dll"
          test -f "$RUNNER_TEMP/wine-loader/modules-iphonesimulator/aarch64-windows/xtajit.dll.dylib"
      - name: A 32-bit x86 program runs in Wine through WoW64 and FEX on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # Wine logs taking xtajit.dll over from its dylib. WINEDEBUG stays the same
          # in all three runs: trace channels change which guest code ntdll runs.
          WINEHOST_EXPECT_LOG: |
            xtajit.dll.dylib" at
            [wow-exit] the code map is written at NtTerminateProcess
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache
          WINEHOST_FEX_CODEMAP: 1
        # ntdll does not take quite the same path in every run (a few blocks differ),
        # so the code map is the union of three runs.
        run: |
          for run in 1 2 3; do
            sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe"
          done
      - name: FEX's offline compiler turns that code map into code caches, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Successfully populated cache
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache
          WINEHOST_EXPECT_FEX_CACHE: 1
          WINEHOST_SYSWOW64: 1
          WINEHOST_JIT: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" process-all
      - name: The x86 program runs again with the code caches loaded, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # The caches are AOT caches: guest addresses, block links and block tails come from
          # a data area, blocks get linked through it, and the code is used as stored.
          WINEHOST_EXPECT_LOG: |
            [aot-cache] enabled
            link records) at code+
            [aot-link] first block link through the data area
            [aot-ro] code final as stored
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache
          WINEHOST_FEX_CODEMAP: 1
          # No x86 block of the program or its DLLs is compiled at run time.
          WINEHOST_FEX_ALL_CACHED: 1
          # FEX also writes its dispatcher code there, for the image below.
          WINEHOST_FEX_DUMP_DISPATCHER: 1
        # Blocks a run still takes beyond the code map are compiled in and it runs again.
        run: |
          sh tests/wine-loader/converge-cache.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe"
      - name: The code caches and FEX's dispatcher are linked into a dylib, as they would be into the app
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexaot/fexaot.dylib"
      - name: The x86 program runs from the code linked into that dylib with NoJIT, the blocks it lacked compiled in until none is left, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # FEX finds every cache in the image's index and runs its code where dyld
          # mapped it; there are no cache files in this cache directory. The dispatcher
          # it generates matches the image's copy, so that copy runs instead. With NoJIT
          # FEX makes no memory executable; it would interpret a block missing from the
          # image and write it to the code map, which has to stay empty here.
          # The host then maps no JIT pool either, which a device without a debugger can't.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            winehost: NoJIT, so no JIT pool
            [nojit] no JIT pool: nothing is written to executable memory
            [aot-image] index at
            [aot-image] linked: code
            [aot-image] loaded linked cache for
            [aot-dispatcher] static code from the AOT image
            [nojit] no code is generated to run
            [wow-bop] system calls go through ntdll's __wine_wow64_bop
            [aot-cache] enabled
            [aot-link] first block link through the data area
            [wow-window] short address map: it ends at 0x7180000000
            page0: MADEIRA_PAGE0=0: page 0 taken to be unavailable
            as an iPad's map refuses it
            [va-profile] ml787 FEX host arena = [0x7100100000, 0x717fffffff]
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
          # As on an iPad without the extended virtual addressing entitlement, whose
          # address map ends at 0x7180000000: the guest window goes below that end.
          WINEHOST_WOW_MAP_END: "0x7180000000"
          # As on an iPad, which maps nothing at address 0: no TEB copy at page 0.
          WINEHOST_PAGE0: "0"
          # As on that iPad, whose kernel refuses mappings at 32-63 GB and past the end
          # of the map: FEX's host band is then the rest of the map above the guest
          # window (patches/fex-wow64/0024), not 0x7c00000000 as on a simulator.
          WINEHOST_VA_HOLES: "0x800000000-0x1000000000,0x7180000000-0x8000000000"
        # As for the program with a window: blocks no JIT run took run in FEX's
        # interpreter and are compiled into the image (patches/fex-wow64/0019, 0020),
        # so the image the app ships (tests/wine-app) has them too.
        run: |
          sh tests/wine-loader/converge-nojit.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" \
            "$RUNNER_TEMP/fexcache"
      - name: The same AOT image, with the blocks the interpreter learned, links for an iPad
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexaot-iphoneos/fexaot.dylib" iphoneos
      - name: Code caches without every fourth block of that code map, as a run that took other paths would leave them
        env:
          WINEHOST_EXPECT_OUTPUT: Successfully populated cache
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-partial
          WINEHOST_EXPECT_FEX_CACHE: 1
          WINEHOST_SYSWOW64: 1
          WINEHOST_JIT: 1
          # The offline compiler also reports how many of the remaining blocks FEX's
          # NoJIT interpreter could run, and which IR ops the others need.
          WINEHOST_FEX_INTERP_SURVEY: 1
        run: |
          mkdir -p "$RUNNER_TEMP/fexcache-partial/codemap"
          cp -R "$RUNNER_TEMP/fexcache/codemap/ready" "$RUNNER_TEMP/fexcache-partial/codemap/"
          cp "$RUNNER_TEMP/fexcache/dispatcher.bin" "$RUNNER_TEMP/fexcache-partial/"
          python3 -I tests/fex-wow64/codemap.py drop --every 4 "$RUNNER_TEMP"/fexcache-partial/codemap/ready/*
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" process-all
      - name: Those code caches linked into a dylib
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache-partial" "$RUNNER_TEMP/fexaot-partial/fexaot.dylib"
      - name: The x86 program runs from that dylib with NoJIT, the blocks missing from it interpreted, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # FEX still makes no memory executable. Each block the image lacks runs in its IR
          # interpreter and is written to the new code map, so the next AOT build has it.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-partial/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            [nojit] no JIT pool: nothing is written to executable memory
            [aot-image] loaded linked cache for
            [nojit] no code is generated to run
            [interp] learned block
            [interp] fallback ran
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-partial-image
          # Without WINEHOST_FEX_ALL_CACHED the code map has to hold blocks: the learned ones.
          WINEHOST_FEX_CODEMAP: 1
        # A block the interpreter runs again runs from its IR cache (patches/fex-wow64/0034).
        run: |
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe"
          sh tests/fex-wow64/interp-cache.sh "$RUNNER_TEMP/wine-loader/host-hello/run.log"
      - name: MMX and SSE instructions give the same results in FEX's NoJIT interpreter as with its JIT, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: "simd: done"
        # simd.exe prints a hash of each instruction's results. It runs with the JIT,
        # then with NoJIT from hello.exe's image, which has none of its blocks, so the
        # interpreter runs every one (patches/fex-wow64/0019, 0026). The lines have to match.
        # Only the result lines count: Wine's stderr lines in run.log start with "simd: " too.
        run: |
          simd="$RUNNER_TEMP/wine-loader/i386-windows/simd.exe"
          log="$RUNNER_TEMP/wine-loader/host-simd/run.log"
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$simd"
          grep -E '^simd: ([a-z0-9-]+ [0-9a-f]{8}|done)$' "$log" >"$RUNNER_TEMP/simd-jit.txt"
          WINEHOST_AOT_IMAGE="$RUNNER_TEMP/fexaot/fexaot.dylib" WINEHOST_FEX_NOJIT=1 \
            WINEHOST_FEX_CACHE="$RUNNER_TEMP/fexcache-simd" WINEHOST_FEX_CODEMAP=1 \
            WINEHOST_EXPECT_LOG='[interp] fallback ran' \
            sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$simd"
          grep -E '^simd: ([a-z0-9-]+ [0-9a-f]{8}|done)$' "$log" >"$RUNNER_TEMP/simd-nojit.txt"
          diff "$RUNNER_TEMP/simd-jit.txt" "$RUNNER_TEMP/simd-nojit.txt"
          echo "$(grep -c . "$RUNNER_TEMP/simd-jit.txt") lines match"
      - name: The x86 program in an image without NX_COMPAT, which turns DEP off, runs from the AOT image with NoJIT, the blocks it lacked compiled in until none is left
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # The 32-bit ntdll's loader turns DEP off for such an image, and FEX then drops
          # every compiled block; the code caches' blocks have to be registered again
          # (patches/fex-wow64/0027), or everything after that runs in the interpreter
          # in every round and the rounds never converge.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-nodep/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            [code-inval] DEP setting changed
            [aot-cache] registering the loaded code caches again after a DEP change
            [aot-dispatcher] static code from the AOT image
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-nodep-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
        # It starts from hello.exe's code caches: the system DLLs' blocks are there, and
        # the rounds add nodep.exe's own and those of ntdll's path that turns DEP off.
        run: |
          rm -rf "$RUNNER_TEMP/fexcache-nodep"
          cp -Rp "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexcache-nodep"
          sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache-nodep" "$RUNNER_TEMP/fexaot-nodep/fexaot.dylib"
          sh tests/wine-loader/converge-nojit.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/nodep.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" \
            "$RUNNER_TEMP/fexcache-nodep"
      - name: The x86 program that VirtualProtects its code and patches it, as a hook installer does, runs from the AOT image with NoJIT, the blocks it lacked compiled in until none is left
        env:
          WINEHOST_EXPECT_OUTPUT: "hook: done"
          # Making a page executable drops its blocks. Those of the image whose bytes did not
          # change come back (patches/fex-wow64/0029): fa's, whose page was only reprotected,
          # and gb's, on the page with the patch. Otherwise they run in the interpreter in
          # every round and the rounds never converge.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-hook/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            [code-inval] executable protection set (alloc/protect)
            registered again after a protection change
            1 of its code pages there changed since the image was mapped
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-hook-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
        run: |
          rm -rf "$RUNNER_TEMP/fexcache-hook"
          cp -Rp "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexcache-hook"
          sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache-hook" "$RUNNER_TEMP/fexaot-hook/fexaot.dylib"
          sh tests/wine-loader/converge-nojit.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/hook.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" \
            "$RUNNER_TEMP/fexcache-hook"
      - name: The x86 program that copies code into memory of its own and runs it there, as a game's sound system does, runs from the AOT image with NoJIT, that code included
        env:
          WINEHOST_EXPECT_OUTPUT: "rtcode: done"
          # The code is in no image. FEX gives its range an id from its bytes and address
          # (patches/fex-wow64/0036): the code map records its blocks under that id, its bytes
          # are saved with the code map, the offline compiler compiles them and the image
          # holds the result. Writes to other data on its page drop its blocks; with the
          # same bytes they come back from the image, or the interpreter runs them in every
          # round and the rounds never converge.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-rtcode/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            made executable at run time: rtcode-20000964-
            code cache from the AOT image
            blocks registered again after an invalidation, bytes unchanged
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-rtcode-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
        run: |
          rm -rf "$RUNNER_TEMP/fexcache-rtcode"
          cp -Rp "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexcache-rtcode"
          sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache-rtcode" "$RUNNER_TEMP/fexaot-rtcode/fexaot.dylib"
          sh tests/wine-loader/converge-nojit.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/rtcode.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" \
            "$RUNNER_TEMP/fexcache-rtcode"
      - name: The x86 program with unaligned accesses runs from an AOT image whose blocks were compiled with plain loads and stores and half barriers
        env:
          WINEHOST_EXPECT_OUTPUT: "unaligned: done"
          # An iPad's CPU faults on an acquire load or release store across 16 bytes; FEX
          # emulates the access, and since AOT code is never patched, it records the block
          # instead (patches/fex-wow64/0030) for the offline compiler to compile in the
          # patched form. The simulator's CPU does not fault, so the code maps get the mark
          # from codemap.py here, and the step checks the compile and the run of its result.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-unaligned/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: "[aot-dispatcher] static code from the AOT image"
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-unaligned-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
        run: |
          cache="$RUNNER_TEMP/fexcache-unaligned"
          program="$RUNNER_TEMP/wine-loader/i386-windows/unaligned.exe"
          rm -rf "$cache"
          cp -Rp "$RUNNER_TEMP/fexcache" "$cache"
          sh tests/fex-wow64/build-aot-image.sh "$cache" "$WINEHOST_AOT_IMAGE"
          sh tests/wine-loader/converge-nojit.sh "$RUNNER_TEMP/wine-loader" "$program" \
            "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" "$cache"
          ready=$(find "$cache/codemap/ready" -type f -iname 'unaligned.exe*')
          built=$(find "$cache/cache" -type f -iname 'unaligned.exe*')
          barriers() { python3 -c 'import sys; print(open(sys.argv[1], "rb").read().count(bytes.fromhex("bf3903d5")))' "$1"; }
          before=$(barriers "$built")
          mkdir -p "$cache/codemap/new"
          python3 tests/fex-wow64/codemap.py halfbarrier "$ready" "$cache/codemap/new/halfbarrier.bin"
          # A library's ready map has no executable marker; process-all must take it back too
          # (the game's image is rebuilt by marking every ready map this way).
          lib=$(find "$cache/codemap/ready" -type f -iname 'kernel32.dll*' | head -n 1)
          python3 tests/fex-wow64/codemap.py halfbarrier "$lib" "$cache/codemap/new/halfbarrier-lib.bin"
          env -u WINEHOST_EXPECT_LOG -u WINEHOST_EXPECT_OUTPUT -u WINEHOST_FEX_CODEMAP -u WINEHOST_FEX_ALL_CACHED \
            -u WINEHOST_FEX_NOJIT -u WINEHOST_AOT_IMAGE \
            WINEHOST_FEX_CACHE="$cache" WINEHOST_EXPECT_OUTPUT="compiled with plain loads and stores and half barriers" \
            WINEHOST_EXPECT_FEX_CACHE=1 WINEHOST_SYSWOW64=1 WINEHOST_JIT=1 WINEHOST_JIT_POOL_MB=2048 \
            sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" process-all
          after=$(barriers "$built")
          echo "unaligned.exe's cache: $before load half barriers before, $after after"
          [ "$after" -gt "$before" ]
          sh tests/fex-wow64/build-aot-image.sh "$cache" "$WINEHOST_AOT_IMAGE"
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$program"
      - name: A 32-bit x86 program with a window draws it with GDI and takes a tap, in Wine through WoW64 and FEX on an iPad simulator
        env:
          # Its user32, gdi32 and win32u are the 32-bit x86 ones, run by FEX with its JIT.
          # It exits after the tap, and FEX writes the code map of the run.
          WINEHOST_CLICK: 50,50
          WINEHOST_EXPECT_LOG: |
            [wow-exit] the code map is written at NtTerminateProcess
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-window
          WINEHOST_FEX_CODEMAP: 1
        # As for hello.exe, the code map is the union of three runs.
        run: |
          for run in 1 2 3; do
            sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/window.exe"
          done
      - name: FEX's offline compiler turns that code map into code caches (x86 program with a window), three caches per process
        env:
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-window
          WINEHOST_SYSWOW64: 1
          WINEHOST_JIT: 1
          WINEHOST_JIT_POOL_MB: 2048
        # As tests/wine-app/game-aot.sh compiles a game's few dozen DLLs, whose code buffers
        # outgrow any JIT pool in one process: process-all --max-caches (patches/fex-wow64/0028)
        # in fresh processes until no cache is left.
        run: sh tests/fex-wow64/process-all-batches.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" 3
      - name: The x86 program with a window runs again with the code caches loaded
        env:
          WINEHOST_CLICK: 50,50
          WINEHOST_EXPECT_LOG: |
            [aot-cache] enabled
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-window
          WINEHOST_FEX_CODEMAP: 1
          # Every x86 block the window, the tap and the exit take was in the code map.
          WINEHOST_FEX_ALL_CACHED: 1
          WINEHOST_FEX_DUMP_DISPATCHER: 1
        run: |
          sh tests/wine-loader/converge-cache.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/window.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe"
      - name: Those code caches linked into a dylib
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache-window" "$RUNNER_TEMP/fexaot-window/fexaot.dylib"
      - name: The x86 program with a window runs from that dylib with NoJIT and takes a tap, the blocks it lacked compiled in until none is left
        env:
          WINEHOST_CLICK: 50,50
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-window/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          # No JIT run took some blocks this run takes (kernelbase's around waits, and
          # from there blocks that start inside code the image compiled as part of a
          # longer block). FEX's interpreter runs them and writes them to the code map;
          # they are compiled into the image's caches, the image is linked again and
          # the program runs again, until a run takes every block from the image.
          # Nothing is made executable in any of these runs.
          WINEHOST_EXPECT_LOG: |
            [nojit] no JIT pool: nothing is written to executable memory
            [aot-dispatcher] static code from the AOT image
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-window-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
          # On the address map of an iPad, as hello.exe's NoJIT run: the image the
          # app ships (tests/wine-app) has the blocks such a run takes.
          WINEHOST_WOW_MAP_END: "0x7180000000"
          WINEHOST_PAGE0: "0"
          WINEHOST_VA_HOLES: "0x800000000-0x1000000000,0x7180000000-0x8000000000"
        run: |
          sh tests/wine-loader/converge-nojit.sh "$RUNNER_TEMP/wine-loader" \
            "$RUNNER_TEMP/wine-loader/i386-windows/window.exe" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" \
            "$RUNNER_TEMP/fexcache-window"
      - name: The same AOT image of the program with a window links for an iPad
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache-window" "$RUNNER_TEMP/fexaot-window-iphoneos/fexaot.dylib" iphoneos
      - name: The x86 program with a window runs with NoJIT from an image whose blocks of window.exe were all found statically, none recorded
        env:
          WINEHOST_CLICK: 50,50
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot-window-static/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            [aot-dispatcher] static code from the AOT image
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-window-static-run
          WINEHOST_FEX_CODEMAP: 1
        # A game run on an iPad meets new code at every screen and interprets it until the
        # next round of recording and compiling; tests/fex-wow64/discover.py walks a PE
        # image's code ahead of time instead. Here window.exe's recorded map and cache are
        # replaced by what the walk finds without them, and the run must take no block of
        # window.exe from the interpreter. (Other modules keep their recorded caches.)
        run: |
          python3 -m pip install --quiet --user --break-system-packages capstone pefile
          cache="$RUNNER_TEMP/fexcache-window-static"
          program="$RUNNER_TEMP/wine-loader/i386-windows/window.exe"
          rm -rf "$cache" "$WINEHOST_FEX_CACHE"
          cp -Rp "$RUNNER_TEMP/fexcache-window" "$cache"
          ready=$(find "$cache/codemap/ready" -type f -iname 'window.exe*')
          [ -n "$ready" ]
          mkdir -p "$cache/codemap/new" "$RUNNER_TEMP/discover"
          python3 tests/fex-wow64/discover.py "$program" "$ready" "$cache/codemap/new/static.bin" --no-recorded --check
          cp "$ready" "$RUNNER_TEMP/discover/recorded.bin"
          rm -f $ready
          find "$cache/cache" -type f -iname 'window.exe*' -delete
          env -u WINEHOST_CLICK -u WINEHOST_EXPECT_LOG -u WINEHOST_FEX_CODEMAP -u WINEHOST_FEX_NOJIT -u WINEHOST_AOT_IMAGE \
            WINEHOST_FEX_CACHE="$cache" WINEHOST_EXPECT_OUTPUT="Successfully populated cache" WINEHOST_EXPECT_FEX_CACHE=1 \
            WINEHOST_SYSWOW64=1 WINEHOST_JIT=1 WINEHOST_JIT_POOL_MB=2048 \
            sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" process-all
          [ -n "$(find "$cache/cache" -type f -iname 'window.exe*' -size +0)" ]
          sh tests/fex-wow64/build-aot-image.sh "$cache" "$WINEHOST_AOT_IMAGE"
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$program"
          # The interpreter writes every block it ran to the run's new code map.
          new=$(find "$WINEHOST_FEX_CACHE/codemap/new" -type f -name '*.bin' -size +0 2>/dev/null || true)
          learned=0
          if [ -n "$new" ]; then
            python3 -I tests/fex-wow64/codemap.py $new || true
            learned=$(python3 -I tests/fex-wow64/codemap.py $new | grep -i 'window\.exe' | awk '{s+=$1} END {print s+0}')
          fi
          echo "window.exe blocks the interpreter ran: $learned"
          [ "$learned" -eq 0 ]
      - name: Window content of the x86 program
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-x86
          path: ${{ runner.temp }}/wine-loader/host-window/frames
          if-no-files-found: ignore
      - name: FEX code map and code caches of the x86 program with a window
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-cache-window
          path: ${{ runner.temp }}/fexcache-window
          if-no-files-found: ignore
      - name: A 32-bit x86 program with a game's import table (DirectInput 8, DirectSound, DirectDraw, winmm, Winsock, TAPI, shell32) loads and calls into it, in Wine through WoW64 and FEX on an iPad simulator
        env:
          # The loader resolves every import and the DLLs behind them (a missing one is c0000135);
          # FEX runs the program and those 32-bit DLLs with its JIT. Its last line:
          WINEHOST_EXPECT_OUTPUT: "imports: done"
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/imports.exe"
      - name: A 32-bit x86 program grows its stacks (an 8 MB main thread and an 8 MB CreateThread thread, through _chkstk, down to a stack overflow) and takes guard pages from VirtualAlloc, in Wine through WoW64 and FEX on an iPad simulator
        env:
          # Every check prints "guard: ok" or "guard: FAIL"; the last line only when all passed.
          WINEHOST_EXPECT_OUTPUT: "guard: all passed"
        run: |
          status=0
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/guard.exe" || status=$?
          grep -E '^guard:|\[fault-rgn\]|mach-deliver|stack overflow|Unhandled' "$RUNNER_TEMP/wine-loader/host-guard/run.log" | head -120 || true
          exit $status
      - name: The same program in a game's folder of its own on a case-sensitive volume, as on an iPad, finds the DLLs it names in capitals (USER32.dll in syswow64, its CASETEST.dll next to it)
        env:
          WINEHOST_EXPECT_OUTPUT: "imports: done"
          # Both found by reading their directory (patches/madeira/0005), its own DLL in its folder.
          WINEHOST_EXPECT_LOG: |
            /syswow64/user32.dll found by reading its directory
            /cs/game/casetest.dll found by reading its directory
        run: |
          # The runner's volume compares names without case, the iPad's does not.
          cs="$RUNNER_TEMP/cs"
          hdiutil create -quiet -size 256m -fs "Case-sensitive APFS" -volname winpad-cs -type SPARSE "$RUNNER_TEMP/cs.sparseimage"
          hdiutil attach -quiet -nobrowse -mountpoint "$cs" "$RUNNER_TEMP/cs.sparseimage"
          # The Wine prefix (with its syswow64) is made under the work directory, so that goes there too.
          mkdir -p "$cs/work" "$cs/game"
          for e in "$RUNNER_TEMP/wine-loader"/*; do
            case "${e##*/}" in host-*) continue ;; esac
            ln -s "$e" "$cs/work/"
          done
          cp "$RUNNER_TEMP/wine-loader/i386-windows/imports.exe" "$RUNNER_TEMP/wine-loader/i386-windows/casetest.dll" "$cs/game/"
          # The program is not under i386-windows: run-host.sh knows it is 32-bit from its PE header.
          sh tests/wine-loader/run-host.sh "$cs/work" "$cs/game/imports.exe"
      - name: A 32-bit x86 program in a game's folder reads its data by a relative path (the current directory is the program's folder, not the Wine prefix)
        env:
          WINEHOST_EXPECT_OUTPUT: "cwd: done"
        run: |
          game="$RUNNER_TEMP/cwd-game"
          mkdir -p "$game/DATA"
          cp "$RUNNER_TEMP/wine-loader/i386-windows/cwd.exe" "$game/"
          echo "game data found" > "$game/DATA/CWD.TXT"
          status=0
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$game/cwd.exe" || status=$?
          grep -E '^cwd:|current directory' "$RUNNER_TEMP/wine-loader/host-cwd/run.log" || true
          exit $status
      - name: Madeira's Wine modules and that xtajit.dll wrapped into dylibs for an iPad
        id: modules-iphoneos
        run: |
          sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphoneos
          cp "$RUNNER_TEMP/xtajit/xtajit.dll" "$RUNNER_TEMP/wine-loader/modules-iphoneos/aarch64-windows/xtajit.dll"
          sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphoneos \
            "$RUNNER_TEMP/wine-loader/modules-iphoneos/aarch64-windows/xtajit.dll"
      # Direct3D 9 for 32-bit programs, as in Madeira (docs/WOW64.md there):
      # DXMT's i386 d3d9shim forwards to its D3D9 frontend (d3d9-emulated.dll),
      # which FEX runs like the program and which reaches Metal through
      # winemetal's 32-bit unix-call table, linked into the host. It needs
      # nothing from the code cache and AOT runs above, so it runs also when
      # one of them failed. DXMT's unix side is built for the iPad too, for the
      # app below.
      - name: Tools for DXMT (meson, ninja, the Metal toolchain)
        if: ${{ !cancelled() }}
        run: |
          brew install meson ninja
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      # Saved right after it is built, not at the end of the job: it takes long
      # to build and should not be lost to a later failing step.
      - name: Restore LLVM for the iPad simulator and the iPad
        if: ${{ !cancelled() }}
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/wine-loader/dxmt-root/toolchains-iphonesimulator
            ${{ runner.temp }}/wine-loader/dxmt-root/toolchains-iphoneos
          key: llvm-15.0.7-ios-${{ hashFiles('tests/wine-i386/build-llvm.sh') }}
      - name: LLVM 15 for the iPad simulator and the iPad, for DXMT's shader compiler
        id: llvm-build
        if: ${{ !cancelled() && steps.llvm.outputs.cache-hit != 'true' }}
        run: |
          sh tests/wine-i386/build-llvm.sh "$RUNNER_TEMP/wine-loader/dxmt-root" iphonesimulator
          sh tests/wine-i386/build-llvm.sh "$RUNNER_TEMP/wine-loader/dxmt-root" iphoneos
      - name: Save LLVM for the iPad simulator and the iPad
        if: ${{ !cancelled() && steps.llvm-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/wine-loader/dxmt-root/toolchains-iphonesimulator
            ${{ runner.temp }}/wine-loader/dxmt-root/toolchains-iphoneos
          key: llvm-15.0.7-ios-${{ hashFiles('tests/wine-i386/build-llvm.sh') }}
      - name: DXMT's unix side (winemetal, airconv with LLVM) for the iPad simulator and the iPad, with Madeira's build script
        if: ${{ !cancelled() }}
        run: |
          sh tests/wine-i386/build-dxmt-unix.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
          sh tests/wine-i386/build-dxmt-unix.sh "$RUNNER_TEMP/wine-loader" iphoneos
      - name: DXMT's i386 d3d9shim, D3D9 frontend and winemetal, the Wine modules they need, and a 32-bit D3D9 cube
        if: ${{ !cancelled() }}
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-i386/build-d3d9.sh "$RUNNER_TEMP/wine-loader"
      # The cube (Madeira's tests/x86/d3d9-cube-x86.c) spins for 8 s and exits with
      # 43 once the GPU has finished its frames. The simulator's GPU cannot finish
      # them: it has neither Metal 3 nor tier 2 argument buffers, the bindless
      # resources DXMT's draws use, and fails the first frame's command buffer
      # (MTLCommandBufferErrorDomain code 1); DXMT then waits for it for good. So
      # this checks what the simulator can do (the device, the Presents, drawables
      # from the window's layer, the capabilities that rule out more) and the cube
      # is still running when the host stops. On an iPad: the app's D3D9 scheme.
      - name: A 32-bit Direct3D 9 program creates its device and presents through DXMT and Metal, in Wine through WoW64 and FEX on an iPad simulator
        if: ${{ !cancelled() }}
        env:
          WINEHOST_EXPECT_OUTPUT: "MADEIRA-D3D9: present 3 hr=0x00000000"
          WINEHOST_EXPECT_EXIT: running
          WINEHOST_SECONDS: 20
          WINEHOST_EXPECT_LOG: |
            MADEIRA-D3D9: Direct3DCreate9 ok
            MADEIRA-D3D9: device created
            MADEIRA-D3D9: present 1 hr=0x00000000
            MADEIRA-D3D9: present 2 hr=0x00000000
            winehost: Metal layer
            winehost: drawable 1 of Metal layer
            winehost: drawable 3 of Metal layer
            winehost: command buffer 1 completed, status 4
            argument buffers tier 1, Metal 3 family: no
        run: |
          sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/d3d9-cube.exe"
          # Shaders that fail to compile on the simulator hand back an NSError;
          # released once too often, it faulted in the pool pop (patches/dxmt/0003).
          if grep -m3 'objc_autoreleasePoolPop' "$RUNNER_TEMP/wine-loader/host-d3d9-cube/run.log"; then
            echo "::error::an autorelease pool released a freed object"; exit 1
          fi
          echo "::notice::D3D9 cube on the simulator: device, Presents and drawables checked; GPU completion of its frames is not, the simulator lacks Metal 3 bindless (tier 2 argument buffers)"
      # After DXMT and the cube, which the app links and carries for its D3D9 scheme.
      - name: The x86 programs in Wine in an iPad app (Xcode project), hello.exe and the one with a window, run on an iPad simulator
        if: ${{ !cancelled() && steps.modules-iphoneos.outcome == 'success' }}
        run: |
          sh tests/wine-app/build-xcode.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/fexaot/fexaot.dylib" \
            "$RUNNER_TEMP/fexaot-iphoneos/fexaot.dylib" "$RUNNER_TEMP/wine-app" \
            "$RUNNER_TEMP/fexaot-window/fexaot.dylib" "$RUNNER_TEMP/fexaot-window-iphoneos/fexaot.dylib"
      - name: Window content of the x86 program in the app, and the app's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-app-window
          path: |
            ${{ runner.temp }}/wine-app/window-frames
            ${{ runner.temp }}/wine-app/wine-*.log
          if-no-files-found: ignore
      - name: Upload the Xcode project of the Wine app
        if: ${{ !cancelled() && steps.modules-iphoneos.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: WinPadWine-xcode
          path: ${{ runner.temp }}/wine-app/WinPadWine-xcode
      - name: Upload the unsigned IPA of the Wine app
        if: ${{ !cancelled() && steps.modules-iphoneos.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: WinPadWine-ipa
          path: ${{ runner.temp }}/wine-app/WinPadWine.ipa
          if-no-files-found: error
      - name: FEX code map and code caches of the x86 run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-cache-hello
          path: ${{ runner.temp }}/fexcache
          if-no-files-found: ignore

  fexcore-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Build FEXCore for iOS
        run: sh tests/ios/build-fexcore.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios"
