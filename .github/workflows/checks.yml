name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syscall-stubs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          python3 -m pip install -q -r tools/pe-reloc-audit/requirements.txt
      - name: Syscall stubs have no code relocations
        run: sh tests/syscall-stubs/run.sh

  fxcc-inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -I tools/fxcc-inspect/test_fxcc_inspect.py
          python3 -I tools/cache2macho/test_cache2macho.py

  fex-cache:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld cmake ninja-build python3 gdb
      - name: Restore FEX build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fex-build
          key: fex-build-${{ runner.arch }}-${{ hashFiles('tests/fex-cache/fex-commit', 'tests/fex-cache/build-fex.sh', 'tests/fex-cache/fetch-fex.sh', 'patches/fex/*.patch', 'tests/probe/*') }}
      - name: Build FEX and generate a code cache
        env:
          WORK_DIR: ${{ runner.temp }}/fex-work
          FEX_BUILD: ${{ runner.temp }}/fex-build
        run: sh tests/fex-cache/run.sh
      - name: Probe frontend runs the guest from an AOT image
        timeout-minutes: 20
        env:
          WORK_DIR: ${{ runner.temp }}/fex-work
          FEX_BUILD: ${{ runner.temp }}/fex-build
        run: sh tests/probe/run.sh
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-cache-census
          path: |
            ${{ runner.temp }}/fex-work/census.json
            ${{ runner.temp }}/fex-work/fexserver.log
            ${{ runner.temp }}/fex-work/fex-*-run.log
            ${{ runner.temp }}/fex-work/aot-census.json
            ${{ runner.temp }}/fex-work/aot*.o
            ${{ runner.temp }}/fex-work/dispatcher1.bin
            ${{ runner.temp }}/fex-work/aot.so
            ${{ runner.temp }}/fex-work/home/.cache/fex-emu
            ${{ runner.temp }}/fex-work/probe
          if-no-files-found: warn

  fex-wow64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build python3
      - name: Restore the FEX WoW64 build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fex-wow64
          key: fex-wow64-${{ hashFiles('tests/fex-wow64/build.sh', 'patches/fex-wow64/*') }}
          restore-keys: fex-wow64-
      - name: FEX's WoW64 module (xtajit.dll) and offline compiler build from Madeira's FEX fork
        run: sh tests/fex-wow64/build.sh "$RUNNER_TEMP/fex-wow64"
      - name: Upload xtajit.dll
        uses: actions/upload-artifact@v4
        with:
          name: xtajit
          path: |
            ${{ runner.temp }}/fex-wow64/xtajit.dll
            ${{ runner.temp }}/fex-wow64/FEXOfflineCompiler.exe

  probe-macos:
    needs: fex-cache
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install ninja lld
          echo "$(brew --prefix lld)/bin" >>"$GITHUB_PATH"
      - name: Code map and guest from the Linux probe run
        uses: actions/download-artifact@v4
        with:
          name: fex-cache-census
          path: ${{ runner.temp }}/linux
      - name: Probe frontend runs the guest from a Mach-O AOT image
        timeout-minutes: 60
        run: sh tests/probe/run-macos.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-macos" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/linux/probe"
      - name: Upload probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-macos
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
      - name: iPad test app as an unsigned IPA
        run: sh tests/ios/build-app.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios-app" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/probe"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinPadProbe-ipa
          path: ${{ runner.temp }}/ipa/WinPadProbe.ipa
          if-no-files-found: error
      - name: iPad test app as an Xcode project, run on an iPad simulator
        timeout-minutes: 60
        run: |
          brew install xcodegen
          sh tests/ios/build-xcode.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios-app" "$RUNNER_TEMP/ipa" \
              "$RUNNER_TEMP/fex-ios-sim" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/xcode"
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: WinPadProbe-xcode
          path: ${{ runner.temp }}/xcode/WinPadProbe-xcode
          if-no-files-found: error

  pe2macho:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install lld
      - name: A Windows DLL wrapped into a dylib runs on the Mac
        run: |
          PATH="$(brew --prefix lld)/bin:$PATH"
          sh tests/pe2macho/run-macos.sh "$RUNNER_TEMP/pe2macho"
      - name: Every Wine module from Madeira wrapped into a dylib and loaded
        run: sh tests/pe2macho/wine-modules.sh "$RUNNER_TEMP/wine-modules"

  wine-loader:
    runs-on: macos-15
    needs: fex-wow64
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bison flex llvm lld xcodegen
      - name: Newest Xcode (Madeira's server_ios.c needs the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode_*.app
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcrun --sdk iphoneos --show-sdk-version
      - name: Boot an iPad simulator now, while Wine builds
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -I tests/ios/xcode/pick-ipad.py 17.0)
          xcrun simctl boot "$udid" || true
      - name: Restore configured Wine tree
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wine-loader/madeira/wine
          key: wine-configured-257f271-${{ hashFiles('tests/wine-loader/build.sh') }}
      - name: Madeira's iOS ntdll loader builds, also with the adopt patch
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-loader/build.sh "$RUNNER_TEMP/wine-loader"
      # The Wine libraries only change with their build scripts and patches;
      # a hit skips the builds below.
      - name: Restore the i386 Wine build tree
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wine-loader/madeira/wine/build-i386
          key: wine-i386-257f271-${{ hashFiles('tests/wine-i386/build.sh', 'patches/wine/0003-*') }}
      - name: Restore built Wine libraries
        id: wine-built
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/wine-loader/ntdll-iphoneos
            ${{ runner.temp }}/wine-loader/ntdll-iphonesimulator
            ${{ runner.temp }}/wine-loader/wineserver-iphoneos
            ${{ runner.temp }}/wine-loader/wineserver-iphonesimulator
            ${{ runner.temp }}/wine-loader/win32u-iphoneos
            ${{ runner.temp }}/wine-loader/win32u-iphonesimulator
            ${{ runner.temp }}/wine-loader/modules-iphonesimulator
          key: wine-built-v1-${{ hashFiles('tests/wine-loader/build*.sh', 'tests/wine-loader/wrap-modules.sh', 'patches/madeira/*', 'patches/wine/*', 'tools/pe2macho/*') }}
      - name: Whole ntdll unix side for iOS, with the adopt patch
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: sh tests/wine-loader/build-ntdll.sh "$RUNNER_TEMP/wine-loader" iphoneos
      - name: The same for the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: sh tests/wine-loader/build-ntdll.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: wineserver for iOS and the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: |
          PATH="$(brew --prefix llvm)/bin:$PATH"
          sh tests/wine-loader/build-wineserver.sh "$RUNNER_TEMP/wine-loader" iphoneos
          sh tests/wine-loader/build-wineserver.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: win32u unix side (windows, GDI, fonts, display driver) for iOS and the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-loader/build-win32u.sh "$RUNNER_TEMP/wine-loader" iphoneos
          sh tests/wine-loader/build-win32u.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: Madeira's Wine modules wrapped into dylibs for the iPad simulator
        if: steps.wine-built.outputs.cache-hit != 'true'
        run: sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphonesimulator
      - name: Wine's 32-bit x86 ntdll, kernelbase and kernel32, and a 32-bit test program
        run: |
          PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          sh tests/wine-i386/build.sh "$RUNNER_TEMP/wine-loader"
      - name: Minimal Wine host linked from both and run on an iPad simulator
        timeout-minutes: 20
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader"
      - name: Wine's clock.exe draws its window with GDI on an iPad simulator
        timeout-minutes: 20
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" 'C:\windows\system32\clock.exe'
      - name: Window content of the clock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-clock
          path: ${{ runner.temp }}/wine-loader/host-clock/frames
          if-no-files-found: ignore
      - name: Wine's notepad.exe takes typed keys and a tap on its menu on an iPad simulator
        env:
          WINEHOST_TYPE: Hello iPad
          WINEHOST_CLICK_MENU: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" 'C:\windows\system32\notepad.exe'
      - name: Window content of notepad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-notepad
          path: ${{ runner.temp }}/wine-loader/host-notepad/frames
          if-no-files-found: ignore
      - name: Wine's Minesweeper (winemine.exe) opens a field when tapped on an iPad simulator
        env:
          WINEHOST_CLICK: 50,70
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" 'C:\windows\system32\winemine.exe'
      - name: Window content of Minesweeper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-winemine
          path: ${{ runner.temp }}/wine-loader/host-winemine/frames
          if-no-files-found: ignore
      - name: FEX's WoW64 module built from source (fex-wow64 job)
        uses: actions/download-artifact@v4
        with:
          name: xtajit
          path: ${{ runner.temp }}/xtajit
      - name: Use it in place of Madeira's prebuilt xtajit.dll
        run: cp "$RUNNER_TEMP/xtajit/xtajit.dll" "$RUNNER_TEMP/wine-loader/modules-iphonesimulator/aarch64-windows/xtajit.dll"
      - name: That xtajit.dll is wrapped into a dylib like the other modules, so Wine runs it from there and not from the JIT pool
        run: |
          sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphonesimulator \
            "$RUNNER_TEMP/wine-loader/modules-iphonesimulator/aarch64-windows/xtajit.dll"
          test -f "$RUNNER_TEMP/wine-loader/modules-iphonesimulator/aarch64-windows/xtajit.dll.dylib"
      - name: A 32-bit x86 program runs in Wine through WoW64 and FEX on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # Wine logs taking xtajit.dll over from its dylib. WINEDEBUG stays the same
          # in all three runs: trace channels change which guest code ntdll runs.
          WINEHOST_EXPECT_LOG: |
            xtajit.dll.dylib" at
            [wow-exit] the code map is written at NtTerminateProcess
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache
          WINEHOST_FEX_CODEMAP: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe"
      - name: FEX's offline compiler turns that code map into code caches, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Successfully populated cache
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache
          WINEHOST_EXPECT_FEX_CACHE: 1
          WINEHOST_SYSWOW64: 1
          WINEHOST_JIT: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/xtajit/FEXOfflineCompiler.exe" process-all
      - name: The x86 program runs again with the code caches loaded, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # The caches are AOT caches: guest addresses, block links and block tails come from
          # a data area, blocks get linked through it, and the code is used as stored.
          WINEHOST_EXPECT_LOG: |
            [aot-cache] enabled
            link records) at code+
            [aot-link] first block link through the data area
            [aot-ro] code final as stored
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache
          WINEHOST_FEX_CODEMAP: 1
          # No x86 block of the program or its DLLs is compiled at run time.
          WINEHOST_FEX_ALL_CACHED: 1
          # FEX also writes its dispatcher code there, for the image below.
          WINEHOST_FEX_DUMP_DISPATCHER: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe"
      - name: The code caches and FEX's dispatcher are linked into a dylib, as they would be into the app
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexaot/fexaot.dylib"
      - name: The same AOT image links for an iPad
        run: sh tests/fex-wow64/build-aot-image.sh "$RUNNER_TEMP/fexcache" "$RUNNER_TEMP/fexaot-iphoneos/fexaot.dylib" iphoneos
      - name: The x86 program runs from the code linked into that dylib with NoJIT, in Wine on an iPad simulator
        env:
          WINEHOST_EXPECT_OUTPUT: Hello from x86
          # FEX finds every cache in the image's index and runs its code where dyld
          # mapped it; there are no cache files in this cache directory. The dispatcher
          # it generates matches the image's copy, so that copy runs instead. With NoJIT
          # FEX makes no memory executable and would stop on a block missing from the image.
          # The host then maps no JIT pool either, which a device without a debugger can't.
          WINEHOST_AOT_IMAGE: ${{ runner.temp }}/fexaot/fexaot.dylib
          WINEHOST_FEX_NOJIT: 1
          WINEHOST_EXPECT_LOG: |
            winehost: NoJIT, so no JIT pool
            [nojit] no JIT pool: nothing is written to executable memory
            [aot-image] index at
            [aot-image] linked: code
            [aot-image] loaded linked cache for
            [aot-dispatcher] static code from the AOT image
            [nojit] no code is generated to run
            [wow-bop] system calls go through ntdll's __wine_wow64_bop
            [aot-cache] enabled
            [aot-link] first block link through the data area
          WINEHOST_FEX_CACHE: ${{ runner.temp }}/fexcache-image
          WINEHOST_FEX_CODEMAP: 1
          WINEHOST_FEX_ALL_CACHED: 1
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/hello.exe"
      - name: A 32-bit x86 program with a window draws it with GDI and takes a tap, in Wine through WoW64 and FEX on an iPad simulator
        env:
          # Its user32, gdi32 and win32u are the 32-bit x86 ones, run by FEX with its JIT.
          WINEHOST_CLICK: 50,50
        run: sh tests/wine-loader/run-host.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/wine-loader/i386-windows/window.exe"
      - name: Window content of the x86 program
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-window-x86
          path: ${{ runner.temp }}/wine-loader/host-window/frames
          if-no-files-found: ignore
      - name: Madeira's Wine modules and that xtajit.dll wrapped into dylibs for an iPad
        run: |
          sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphoneos
          cp "$RUNNER_TEMP/xtajit/xtajit.dll" "$RUNNER_TEMP/wine-loader/modules-iphoneos/aarch64-windows/xtajit.dll"
          sh tests/wine-loader/wrap-modules.sh "$RUNNER_TEMP/wine-loader" iphoneos \
            "$RUNNER_TEMP/wine-loader/modules-iphoneos/aarch64-windows/xtajit.dll"
      - name: The x86 program in Wine in an iPad app (Xcode project), run on an iPad simulator
        run: |
          sh tests/wine-app/build-xcode.sh "$RUNNER_TEMP/wine-loader" "$RUNNER_TEMP/fexaot/fexaot.dylib" \
            "$RUNNER_TEMP/fexaot-iphoneos/fexaot.dylib" "$RUNNER_TEMP/wine-app"
      - name: Upload the Xcode project of the Wine app
        uses: actions/upload-artifact@v4
        with:
          name: WinPadWine-xcode
          path: ${{ runner.temp }}/wine-app/WinPadWine-xcode
      - name: FEX code map and code caches of the x86 run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fex-cache-hello
          path: ${{ runner.temp }}/fexcache
          if-no-files-found: ignore

  fexcore-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Build FEXCore for iOS
        run: sh tests/ios/build-fexcore.sh "$RUNNER_TEMP/fex" "$RUNNER_TEMP/fex-ios"
